# 클러스터 간 복제 설정 예제

---
# 시나리오 1: 단방향 복제 (Primary -> Secondary)

# Primary 클러스터 (서울)
primary_cluster:
  local:
    cluster_id: "cluster-seoul"
    cluster_name: "Seoul Primary"
  
  cross_cluster_replication:
    enabled: true
    mode: "push"  # 서울 -> 부산
    conflict_strategy: "source-wins"
    
    batch_size: 100
    batch_interval: "5s"
    retry_attempts: 3
    retry_backoff: "1s"
    timeout: "10s"
    
  remote_clusters:
    - id: "cluster-busan"
      name: "Busan Secondary"
      endpoints:
        - "https://busan-node1.company.com:9090"
        - "https://busan-node2.company.com:9090"
        - "https://busan-node3.company.com:9090"
      enabled: true
      priority: 1
      bidirectional: false
      api_key: "secret-api-key-12345"
      tls_enabled: true

# Secondary 클러스터 (부산)
secondary_cluster:
  local:
    cluster_id: "cluster-busan"
    cluster_name: "Busan Secondary"
  
  cross_cluster_replication:
    enabled: true
    mode: "pull"  # 서울에서 수신
    conflict_strategy: "source-wins"

---
# 시나리오 2: 양방향 복제 (Multi-Region)

# 미국 클러스터
us_cluster:
  local:
    cluster_id: "cluster-us-east"
    cluster_name: "US East Cluster"
  
  cross_cluster_replication:
    enabled: true
    mode: "bidirectional"
    conflict_strategy: "last-write-wins"
    
    batch_size: 50
    batch_interval: "10s"
    
  remote_clusters:
    - id: "cluster-eu-west"
      name: "EU West Cluster"
      endpoints:
        - "https://eu-lb.company.com:9090"
      enabled: true
      priority: 1
      bidirectional: true
      api_key: "eu-api-key"
    
    - id: "cluster-ap-south"
      name: "Asia Pacific Cluster"
      endpoints:
        - "https://ap-lb.company.com:9090"
      enabled: true
      priority: 2
      bidirectional: true
      api_key: "ap-api-key"

# 유럽 클러스터
eu_cluster:
  local:
    cluster_id: "cluster-eu-west"
    cluster_name: "EU West Cluster"
  
  cross_cluster_replication:
    enabled: true
    mode: "bidirectional"
    conflict_strategy: "last-write-wins"
    
  remote_clusters:
    - id: "cluster-us-east"
      name: "US East Cluster"
      endpoints:
        - "https://us-lb.company.com:9090"
      enabled: true
      bidirectional: true
      api_key: "us-api-key"
    
    - id: "cluster-ap-south"
      name: "Asia Pacific Cluster"
      endpoints:
        - "https://ap-lb.company.com:9090"
      enabled: true
      bidirectional: true
      api_key: "ap-api-key"

---
# 시나리오 3: Hub-and-Spoke 복제

# Hub 클러스터 (중앙)
hub_cluster:
  local:
    cluster_id: "cluster-hub"
    cluster_name: "Central Hub"
  
  cross_cluster_replication:
    enabled: true
    mode: "bidirectional"
    conflict_strategy: "source-wins"  # Hub 우선
    
  remote_clusters:
    - id: "cluster-spoke1"
      name: "Spoke 1 - Branch Office 1"
      endpoints: ["https://branch1.company.com:9090"]
      enabled: true
      priority: 1
    
    - id: "cluster-spoke2"
      name: "Spoke 2 - Branch Office 2"
      endpoints: ["https://branch2.company.com:9090"]
      enabled: true
      priority: 1
    
    - id: "cluster-spoke3"
      name: "Spoke 3 - Branch Office 3"
      endpoints: ["https://branch3.company.com:9090"]
      enabled: true
      priority: 1

# Spoke 클러스터 (지사)
spoke_cluster:
  local:
    cluster_id: "cluster-spoke1"
    cluster_name: "Branch Office 1"
  
  cross_cluster_replication:
    enabled: true
    mode: "bidirectional"
    conflict_strategy: "target-wins"  # Hub 우선
    
  remote_clusters:
    - id: "cluster-hub"
      name: "Central Hub"
      endpoints: ["https://hub.company.com:9090"]
      enabled: true
      bidirectional: true

---
# 시나리오 4: 계층적 복제 (DR)

# Production 클러스터
production:
  local:
    cluster_id: "cluster-prod"
    cluster_name: "Production"
  
  cross_cluster_replication:
    enabled: true
    mode: "push"
    conflict_strategy: "source-wins"
    batch_interval: "1s"  # 빠른 복제
    
  remote_clusters:
    - id: "cluster-dr"
      name: "Disaster Recovery"
      endpoints: ["https://dr.company.com:9090"]
      enabled: true
      priority: 1
    
    - id: "cluster-backup"
      name: "Backup Cluster"
      endpoints: ["https://backup.company.com:9090"]
      enabled: true
      priority: 2

# DR 클러스터
disaster_recovery:
  local:
    cluster_id: "cluster-dr"
    cluster_name: "Disaster Recovery"
  
  cross_cluster_replication:
    enabled: true
    mode: "pull"
    conflict_strategy: "source-wins"

---
# 시나리오 5: 선택적 복제 (필터링)

filtered_replication:
  local:
    cluster_id: "cluster-main"
    cluster_name: "Main Cluster"
  
  cross_cluster_replication:
    enabled: true
    mode: "push"
    
    # 필터링 규칙
    include_patterns:
      - "production-*"     # production으로 시작하는 키만
      - "*-critical"       # critical로 끝나는 키만
    
    exclude_patterns:
      - "temp-*"           # 임시 키 제외
      - "*-cache"          # 캐시 키 제외
    
  remote_clusters:
    - id: "cluster-filtered"
      name: "Filtered Cluster"
      endpoints: ["https://filtered.company.com:9090"]
      enabled: true

---
# 시나리오 6: 고급 설정

advanced_config:
  local:
    cluster_id: "cluster-advanced"
    cluster_name: "Advanced Cluster"
  
  cross_cluster_replication:
    enabled: true
    mode: "bidirectional"
    conflict_strategy: "manual"  # 수동 해결
    
    # 성능 튜닝
    batch_size: 500             # 큰 배치
    batch_interval: "30s"       # 느린 간격
    retry_attempts: 5
    retry_backoff: "2s"
    timeout: "30s"
    
    # 보안
    enable_encryption: true
    enable_compression: true
    
  remote_clusters:
    - id: "cluster-remote"
      name: "Remote Cluster"
      endpoints:
        - "https://remote1.company.com:9090"
        - "https://remote2.company.com:9090"
        - "https://remote3.company.com:9090"
      enabled: true
      priority: 1
      bidirectional: true
      api_key: "secure-api-key"
      tls_enabled: true
