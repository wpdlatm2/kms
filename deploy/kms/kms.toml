default_username = "admin"

[db]
database_type = "sqlite"
sqlite_path = "/data"

[tls]
tls_cert_file = "/pki/kms.crt"
tls_key_file = "/pki/kms.key"
# Only clients with a certificate issued by this CA are accepted (KMIP socket and HTTP API).
clients_ca_cert_file = "/pki/ca.crt"

[socket_server]
socket_server_start = true
socket_server_port = 5696
socket_server_hostname = "0.0.0.0"

[http]
port = 9998
hostname = "0.0.0.0"
rate_limit_per_second = 50
