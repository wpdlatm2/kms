version: '3.8'

services:
  # Node 1 - Leader (Bootstrap)
  kmip-node1:
    build: .
    container_name: kmip-node1
    hostname: kmip-node1
    networks:
      kmip-network:
        ipv4_address: 172.20.0.11
    ports:
      - "5696:5696"   # KMIP
      - "7000:7000"   # Raft
      - "8080:8080"   # Management API
      - "9090:9090"   # REST API
    volumes:
      # 설정 파일
      - ./config/node1:/app/config:ro
      # 데이터 (영구 저장)
      - ./volumes/node1/data:/app/data
      # 로그
      - ./volumes/node1/logs:/app/logs
      # 백업 (새로 추가)
      - ./backup:/backup
      # 인증서
      - ./certs:/app/certs:ro
    environment:
      - NODE_ID=node-1
      - CLUSTER_ID=cluster-default
      - RAFT_ADDR=172.20.0.11:7000
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - TZ=Asia/Seoul
      # 백업 설정
      - BACKUP_RETENTION_DAYS=30
      - MAX_BACKUPS=10
      - BACKUP_SCHEDULE=0 2 * * *
      # 로그 설정
      - MAX_LOG_SIZE=100M
      - MAX_LOG_AGE=7
      - MAX_LOG_BACKUPS=10
      - COMPRESS_LOGS=true
      - LOG_ROTATION_SCHEDULE=0 * * * *
      # Syslog 설정 (선택적)
      # - SYSLOG_SERVER=syslog.example.com
      # - SYSLOG_PORT=514
      # - SYSLOG_PROTOCOL=udp
    command: >
      -node-id node-1
      -raft-addr 172.20.0.11:7000
      -data-dir /app/data
      -bootstrap
      -use-raft
      -replication true
      -replication-mode quorum
      -replication-factor 3
      -min-replicas 2
      -enable-rest
      -rest-addr :9090
      -addr :5696
      -http-addr :8080
      -cert /app/certs/server.crt
      -key /app/certs/server.key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node 2 - Follower
  kmip-node2:
    build: .
    container_name: kmip-node2
    hostname: kmip-node2
    networks:
      kmip-network:
        ipv4_address: 172.20.0.12
    ports:
      - "5697:5696"   # KMIP
      - "7001:7000"   # Raft
      - "8081:8080"   # Management API
      - "9091:9090"   # REST API
    volumes:
      - ./config/node2:/app/config:ro
      - ./volumes/node2/data:/app/data
      - ./volumes/node2/logs:/app/logs
      - ./backup:/backup
      - ./certs:/app/certs:ro
    environment:
      - NODE_ID=node-2
      - CLUSTER_ID=cluster-default
      - RAFT_ADDR=172.20.0.12:7000
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - TZ=Asia/Seoul
      - BACKUP_RETENTION_DAYS=30
      - MAX_BACKUPS=10
      - BACKUP_SCHEDULE=0 3 * * *
      - MAX_LOG_SIZE=100M
      - MAX_LOG_AGE=7
      - MAX_LOG_BACKUPS=10
      - COMPRESS_LOGS=true
      - LOG_ROTATION_SCHEDULE=0 * * * *
    command: >
      -node-id node-2
      -raft-addr 172.20.0.12:7000
      -data-dir /app/data
      -use-raft
      -replication true
      -replication-mode quorum
      -replication-factor 3
      -min-replicas 2
      -enable-rest
      -rest-addr :9090
      -addr :5696
      -http-addr :8080
      -cert /app/certs/server.crt
      -key /app/certs/server.key
    depends_on:
      - kmip-node1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node 3 - Follower
  kmip-node3:
    build: .
    container_name: kmip-node3
    hostname: kmip-node3
    networks:
      kmip-network:
        ipv4_address: 172.20.0.13
    ports:
      - "5698:5696"   # KMIP
      - "7002:7000"   # Raft
      - "8082:8080"   # Management API
      - "9092:9090"   # REST API
    volumes:
      - ./config/node3:/app/config:ro
      - ./volumes/node3/data:/app/data
      - ./volumes/node3/logs:/app/logs
      - ./backup:/backup
      - ./certs:/app/certs:ro
    environment:
      - NODE_ID=node-3
      - CLUSTER_ID=cluster-default
      - RAFT_ADDR=172.20.0.13:7000
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - TZ=Asia/Seoul
      - BACKUP_RETENTION_DAYS=30
      - MAX_BACKUPS=10
      - BACKUP_SCHEDULE=0 4 * * *
      - MAX_LOG_SIZE=100M
      - MAX_LOG_AGE=7
      - MAX_LOG_BACKUPS=10
      - COMPRESS_LOGS=true
      - LOG_ROTATION_SCHEDULE=0 * * * *
    command: >
      -node-id node-3
      -raft-addr 172.20.0.13:7000
      -data-dir /app/data
      -use-raft
      -replication true
      -replication-mode quorum
      -replication-factor 3
      -min-replicas 2
      -enable-rest
      -rest-addr :9090
      -addr :5696
      -http-addr :8080
      -cert /app/certs/server.crt
      -key /app/certs/server.key
    depends_on:
      - kmip-node1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kmip-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  node1-data:
  node2-data:
  node3-data:
